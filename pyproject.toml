[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "linkbudget-rf"
version = "0.1.0"
description = "A small Python library for building RF/communications link budgets"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Hall", email = "chris93hall@gmail.com" },
]
keywords = [
    "rf", "link-budget", "link budget", "satcom", "radar",
    "communications", "antenna", "noise-figure", "eirp", "g/t",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21.5",
    "fpdf2>=2.8.1",
]

[project.urls]
Homepage = "https://github.com/Chris93Hall/linkbudget"
Documentation = "https://chris93hall.github.io/linkbudget/"
Repository = "https://github.com/Chris93Hall/linkbudget"
Issues = "https://github.com/Chris93Hall/linkbudget/issues"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[tool.setuptools]
packages = ["linkbudget"]

[tool.setuptools.package-data]
linkbudget = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # a broken system-packaged matplotlib coexisting with a pip one warns here
    "ignore:Unable to import Axes3D:UserWarning",
]

[tool.coverage.run]
source = ["linkbudget"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage"

[tool.pylint.main]
py-version = "3.8"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Docstrings, whitespace and line-length checks are all enabled; only these
# refactor heuristics that don't fit this small, data-model-heavy library are off.
disable = [
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "chained-comparison",
    "duplicate-code",
]
