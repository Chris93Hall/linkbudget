[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkbudget"
version = "0.1.0"
description = "A small Python library for building RF/communications link budgets"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "chris", email = "chris93hall@gmail.com" },
]
dependencies = [
    "numpy>=1.21.5",
    "fpdf2>=2.8.1",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[tool.setuptools]
packages = ["linkbudget"]

[tool.setuptools.package-data]
linkbudget = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # a broken system-packaged matplotlib coexisting with a pip one warns here
    "ignore:Unable to import Axes3D:UserWarning",
]

[tool.coverage.run]
source = ["linkbudget"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage"

[tool.pylint.main]
py-version = "3.8"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Keep whitespace and line-length checks (C0301, C0303, C0304, C0305) enabled.
# Silence conventions/refactors that don't fit this small, data-model-heavy library.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "chained-comparison",
    "duplicate-code",
]
